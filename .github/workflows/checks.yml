name: Offline tests and release build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r plugins/tina-bridge/server/requirements-lock.txt
      - run: python scripts/run_tests.py
      - run: python scripts/build_release.py --output dist
      - run: python scripts/build_release.py --output build/reproduction
      - name: Compare reproducible archives
        shell: pwsh
        run: |
          $first = Get-ChildItem dist -Filter '*.zip' | Get-FileHash
          $second = Get-ChildItem build/reproduction -Filter '*.zip' | Get-FileHash
          if ($first.Hash -ne $second.Hash) { throw 'Release bytes differ' }
